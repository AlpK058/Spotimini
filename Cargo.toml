[package]
name = "spotimini"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.33"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
env_logger = "0.11"
log = "0.4"
futures-util = "0.3"
librespot = { version = "0.8", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots", "with-libmdns"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
base64 = "0.22"
getrandom = "0.3"
keyring = { version = "3.6", features = ["windows-native"] }
open = "5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
url = "2.5"
